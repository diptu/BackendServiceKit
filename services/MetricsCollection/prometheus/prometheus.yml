# Prometheus configuration for NutraTenant

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    platform: nutratenant
    environment: development

# Alert rules + recording rules — loaded from mounted directories.
# `rules/*.yml` was missing here entirely until this fix — recording.yml
# was mounted into the container (docker-compose.yml's `prometheus` service
# volumes) but never referenced by rule_files, so it was never loaded or
# evaluated at all, independent of the metric-name bugs fixed in that file
# itself. Verified by loading this config into a real Prometheus container
# and checking `/api/v1/rules` shows both recording rules present.
rule_files:
  - /etc/prometheus/alerts/*.yml
  - /etc/prometheus/rules/*.yml

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

scrape_configs:
  # OTel Collector Prometheus scrape endpoint (all app metrics flow through here)
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # OTel Collector self-metrics
  - job_name: otel-collector-internal
    static_configs:
      - targets:
          - otel-collector:8888
    metrics_path: /metrics

  # Kong proxy metrics (exposed on Admin API port)
  - job_name: kong
    static_configs:
      - targets:
          - kong:8001
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # FastAPI APIGateway direct scrape (fallback if OTel pipeline is down)
  - job_name: api-gateway
    static_configs:
      - targets:
          - api-gateway:8000
    metrics_path: /metrics

  # Tenent service direct scrape
  - job_name: tenent
    static_configs:
      - targets:
          - tenent:8000
    metrics_path: /metrics

  # Logging service direct scrape — was previously exposing /metrics with
  # nothing scraping it (found while building services/MetricsCollection).
  - job_name: logging
    static_configs:
      - targets:
          - logging:8000
    metrics_path: /metrics

  # Distributed Tracing service direct scrape — same gap as logging above.
  - job_name: distributed-tracing
    static_configs:
      - targets:
          - distributed-tracing:8000
    metrics_path: /metrics

  # Metrics Collection service's own self-instrumentation (separate from the
  # domain API this service exposes at /api/v1/metrics/*).
  - job_name: metrics-collection
    static_configs:
      - targets:
          - metrics-collection:8000
    metrics_path: /metrics

  # Pushgateway — honor_labels is required so Pushgateway's own job/instance
  # grouping-key labels on pushed series aren't overwritten by Prometheus's
  # default relabeling (which would otherwise stamp job="pushgateway" over
  # whatever job the pusher actually specified).
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
