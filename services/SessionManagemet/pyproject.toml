[project]
name = "session-management"
version = "0.1.0"
description = "Session Management — authenticated user session lifecycle, tracking, and revocation within a tenant"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.115.0",
    "greenlet>=3.5.3",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.5.0",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../.."]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = "^(alembic/|tests/fixtures/)"

[[tool.mypy.overrides]]
module = "shared.*"
ignore_missing_imports = true
