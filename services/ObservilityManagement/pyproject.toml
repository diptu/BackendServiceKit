[project]
name = "observability-management-service"
version = "0.1.0"
description = "ObservilityManagement — merged Logging, DistributedTracing, MetricsCollection, Monitoring, Alerting, Observability, HealthCheck into one deployable service"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "gunicorn>=23.0.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "pyyaml>=6.0.2",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../.."]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = "^tests/"

[tool.ruff]
line-length = 100
